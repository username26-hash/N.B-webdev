<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Color Theory</title>
        <meta charset="UTF-8">
    </head>
<style>
    .complementary{
        width: 350px;
        height: 350px;
        background-color: rgb(1, 1, 255);
        border-radius: 15px;
        border: solid 25px #f88400
    }
    .analogous{
        width: 350px;
        height: 350px;
        background-color:rgb(49, 209, 9);
        border-radius: 15px;
        border: solid 25px #f4f800
    }
    .triadic{
        width: 350px;
        height: 350px;
        background-color: rgb(255, 0, 0);
        border-radius: 15px;
        border: solid 25px #0c00f8;
        color:#fcf812
    }

</style>

    

<body>
    <div class = "complementary">
        <h1>Complementary</h1>
    </div>
    
    <div class ="analogous">
        <h1>Analogous</h1>
    </div>

    <div class="triadic">
        <h1>Triadic</h1>
    </div>
</body>
</html>
